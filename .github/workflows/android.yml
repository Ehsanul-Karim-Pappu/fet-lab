name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate scenes and guide destinations
        run: |
          python3 scripts/verify.py
          python3 scripts/test_guide.py
          python3 scripts/ktcheck.py android/app/src/main/java/io/github/ehsanulkarimpappu/fetlab/*.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle directly, so the repository does not have to carry
      # gradle-wrapper.jar. Android Studio generates a wrapper locally if you want one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fet-lab-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
