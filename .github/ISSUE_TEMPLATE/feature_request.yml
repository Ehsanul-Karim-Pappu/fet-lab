name: Feature request
description: A device, view or capability that would make something clearer.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: What does it make clearer
      description: >
        This is a teaching tool. The strongest requests explain what a reader would
        understand afterwards that they do not understand now.
    validations: { required: true }
  - type: input
    id: reference
    attributes:
      label: Reference
      description: A paper, figure or link, if the request is about device structure.
